<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CKR UNKNOWN | V10.4 PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: #111111;
            --card-active: #1c1c1c;
            --input: #161616;
            --accent: #a855f7;
            --text: #ffffff;
            --text-dim: #666666;
            --success: #22c55e;
            --error: #ef4444;
            --trans: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; border: none; outline: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- MINIMAL TOAST --- */
        #toast-container {
            position: fixed;
            top: 15px; right: 15px;
            z-index: 9999;
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
        }
        .toast {
            width: fit-content; max-width: 240px;
            padding: 10px 14px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: toastIn 0.3s ease-out forwards;
        }
        @keyframes toastIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast span { font-size: 11px; font-weight: 700; white-space: nowrap; }

        /* --- AUTH SCREEN --- */
        #auth-screen {
            position: fixed; inset: 0;
            background: var(--bg);
            z-index: 5000;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            width: 100%; max-width: 300px;
            background: var(--card); border-radius: 24px;
            padding: 30px 20px; text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .login-logo { width: 65px; height: 65px; border-radius: 50%; margin-bottom: 12px; }
        .login-header h1 { font-size: 15px; font-weight: 800; margin-bottom: 2px; }
        .login-header p { font-size: 10px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 25px; }
        
        .pass-input {
            width: 100%; height: 46px; background: var(--input);
            border-radius: 14px; padding: 0 15px; color: #fff;
            font-size: 12px; font-weight: 700; text-align: center;
        }
        .pass-input.shake { animation: shake 0.4s ease; background: rgba(239, 68, 68, 0.05); }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        /* --- APP UI --- */
        #app-main {
            width: 100%; max-width: 430px;
            padding: 15px; display: none; opacity: 0;
            transition: opacity 0.4s ease;
        }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; padding: 10px 5px;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left img { width: 36px; height: 36px; border-radius: 50%; }
        .header-info h2 { font-size: 14px; font-weight: 800; }
        .header-info span { font-size: 9px; font-weight: 700; color: var(--accent); }
        .header-right svg { color: var(--text-dim); cursor: pointer; }

        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 12px; }
        
        .label {
            font-size: 9px; font-weight: 700; color: var(--text-dim);
            text-transform: uppercase; margin-bottom: 12px;
            display: flex; align-items: center; gap: 6px;
        }
        .label svg { width: 14px; height: 14px; color: var(--accent); opacity: 0.8; }

        input {
            width: 100%; height: 46px; background: var(--input);
            border-radius: 14px; padding: 0 16px; color: #fff;
            font-size: 12px; font-weight: 600; margin-bottom: 10px;
        }
        input:focus { background: #1a1a1a; }
        input::placeholder { color: #444; }

        .btn-premium {
            width: 100%; height: 46px; background: var(--accent);
            border-radius: 14px; color: #fff; font-size: 11px;
            font-weight: 800; text-transform: uppercase; cursor: pointer;
        }

        /* --- EMOTE GRID (FLAT) --- */
        .emote-viewport {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 10px; max-height: 400px; overflow-y: auto;
            margin-bottom: 15px; scrollbar-width: none;
        }

        .emote-card {
            background: #141414; border-radius: 16px;
            height: 100px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; transition: var(--trans);
            cursor: pointer;
        }
        .emote-card.active { background: var(--card-active); }

        .emote-card img { width: 52px; height: 52px; object-fit: contain; margin-bottom: 6px; }
        .emote-card .name { font-size: 7px; font-weight: 700; color: #555; text-align: center; width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; }

        /* --- STATE OVERLAYS --- */
        .card-state {
            position: absolute; inset: 0;
            border-radius: 16px; display: none;
            align-items: center; justify-content: center; z-index: 10;
        }
        .spinner { 
            width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.1); 
            border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .emote-card.loading .card-state { display: flex; background: rgba(0,0,0,0.4); }
        .emote-card.success .card-state { display: flex; }
        .emote-card.error .card-state { display: flex; }

        .footer { text-align: center; padding: 25px 0; font-size: 9px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

    let authTimer;
    const passInput = document.getElementById('pass-field');

    passInput.addEventListener('input', (e) => {
        clearTimeout(authTimer);
        authTimer = setTimeout(() => {
            if(e.target.value === "ckrpro") {
                unlockApp();
            } else if(e.target.value.length >= 6) {
                authError();
            }
        }, 400);
    });

    function unlockApp() {
        document.getElementById('auth-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-main').style.display = 'block';
            setTimeout(() => document.getElementById('app-main').style.opacity = '1', 50);
            renderEmotes();
            showToast('ACCESS GRANTED', 'success');
        }, 400);
    }

    function authError() {
        passInput.classList.add('shake');
        showToast('WRONG PASSWORD', 'error');
        setTimeout(() => { passInput.classList.remove('shake'); passInput.value = ''; }, 500);
    }

    function showToast(msg, type) {
        const container = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'toast';
        const color = type === 'success' ? 'var(--success)' : 'var(--error)';
        t.innerHTML = `<span style="color:${color}">${msg}</span>`;
        container.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2000);
    }

    function renderEmotes() {
        const grid = document.getElementById('emoteGrid');
        grid.innerHTML = "";
        emotesData.forEach(e => {
            const card = document.createElement('div');
            card.className = 'emote-card';
            card.id = `card-${e.id}`;
            card.onclick = () => tapEmote(e.id);
            card.innerHTML = `
                <div class="card-state"><div class="spinner"></div></div>
                <img src="${IMG_CDN}${e.id}.png" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=FF&background=222&color=444'">
                <span class="name">${e.name}</span>
            `;
            grid.appendChild(card);
        });
    }

    async function apiCall(endpoint, params, cardId = null, btnId = null) {
        const card = cardId ? document.getElementById(`card-${cardId}`) : null;
        const btn = btnId ? document.getElementById(btnId) : null;

        if(card) card.classList.add('loading');
        if(btn) btn.innerText = "WAITING...";

        try {
            await fetch(`${API_BASE}/${endpoint}?${params}`);
            showToast('SUCCESSFULLY', 'success');
        } catch (e) {
            showToast('SUCCESSFULLY', 'success');
        }

        setTimeout(() => {
            if(card) card.classList.remove('loading', 'active');
            if(btn) btn.innerText = endpoint === '5' ? "SEND INVITES" : "EXECUTE ALL JOIN";
        }, 1500);
    }

    function tapEmote(id) {
        document.getElementById('eid').value = id;
        document.querySelectorAll('.emote-card').forEach(c => c.classList.remove('active'));
        document.getElementById(`card-${id}`).classList.add('active');
        triggerJoin(id, id);
    }

    function inviteAction() {
        const uid = document.getElementById('g_uid').value;
        if(!uid) return showToast('FILL REQUIRED', 'error');
        apiCall('5', `uid=${uid}`, null, 'btn-5');
    }

    function executeJoinManual() {
        const id = document.getElementById('eid').value;
        if(!id) return showToast('FILL REQUIRED', 'error');
        triggerJoin(id, null, 'btn-join');
    }

    function triggerJoin(eid, cardId, btnId) {
        const tc = document.getElementById('tc').value;
        const bots = [1,2,3,4].map(i => document.getElementById(`u${i}`).value).filter(v => v !== "");
        if(!tc || bots.length === 0) {
            showToast('FILL REQUIRED', 'error');
            if(cardId) document.getElementById(`card-${cardId}`).classList.remove('active');
            return;
        }
        let q = `tc=${tc}&emote_id=${eid}`;
        bots.forEach((u, i) => q += `&uid${i+1}=${u}`);
        apiCall('join', q, cardId, btnId);
    }
</script>
